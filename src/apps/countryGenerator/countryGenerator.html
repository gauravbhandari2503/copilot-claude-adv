<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Generator - Vanilla Apps</title>
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="countryGenerator.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav-bar">
        <a href="../../index.html" class="nav-link">← Home</a>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <h1>🌍 Country Generator</h1>

        <!-- Main Display Area -->
        <div class="display-area" id="display">
            <div class="country-display">
                <p class="country-text">Press the button to generate a country</p>
                <div class="country-name" id="countryName">-</div>
            </div>
        </div>

        <!-- Main Action Button -->
        <button id="mainButton" class="action-button">
            Generate Country
        </button>

        <!-- Statistics Section -->
        <div class="stats-section">
            <h2>Statistics</h2>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Generated:</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
            </div>
        </div>

        <!-- History Section -->
        <div class="history-section">
            <h2>History</h2>
            <div id="history" class="history-list">
                <p class="empty-message">No history yet.</p>
            </div>
        </div>
    </div>

    <script src="countryGenerator.js"></script>
</body>
</html>
