<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller - Vanilla Apps</title>
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="diceRoller.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav-bar">
        <a href="../../index.html" class="nav-link">← Home</a>
    </nav>
    
    <!-- Main Container -->
    <div class="container">
        <h1>🎲 Dice Roller Application</h1>
        
        <!-- Dice Display -->
        <div class="dice-display" id="diceDisplay">
            <div class="dice-number">?</div>
        </div>
        
        <!-- Roll Button -->
        <button id="rollButton" class="roll-button">Roll your Luck</button>
        
        <!-- Statistics Section -->
        <div class="stats-section">
            <h2>Statistics</h2>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Rolls:</span>
                    <span class="stat-value" id="totalRolls">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Average:</span>
                    <span class="stat-value" id="average">0.0</span>
                </div>
            </div>
        </div>
        
        <!-- History Section -->
        <div class="history-section">
            <h2>Roll History</h2>
            <div id="history" class="history-list">
                <p class="empty-message">No rolls yet. Click the button to start!</p>
            </div>
        </div>
    </div>
    
    <script src="diceRoller.js"></script>
</body>
</html>
